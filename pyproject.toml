[project]
name = "pygame_popup"
version = "0.11.2"
dependencies = [
    "pygame-ce==2.5.8",
]
requires-python = ">=3.14"
authors = [
    {name = "Grimmys", email = "grimmys.programming@gmail.com"},
]
maintainers = [
    {name = "Grimmys", email = "grimmys.programming@gmail.com"},
]
description = "Library to easily build a UI in a pygame project"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/Grimmys/pygame_popup_manager"
Documentation = "https://pygame-popup-manager.readthedocs.io/en/latest"
Issues = "https://github.com/Grimmys/pygame_popup_manager/issues"
Changelog = "https://github.com/Grimmys/pygame_popup_manager/blob/main/CHANGELOG.txt"

[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
docs = [
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]
linting = [
    "flake8>=7.3.0",
    "pylint>=4.0.7",
    "pylint-exit>=1.2.0",
]
